[workspace]
resolver = "3"
members = [
    "crates/bencode",
    "crates/metainfo",
    "crates/profile",
    "crates/wire",
    "crates/tracker",
    "crates/picker",
    "crates/mse",
    "crates/session",
    "crates/urtorrent",
    "crates/uring",
    "crates/storage",
    "testkit",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/urtorrent/urtorrent"
authors = ["urtorrent contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
sha1 = "0.10"
sha2 = "0.10"
libc = "0.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

[profile.release]
debug = 1
