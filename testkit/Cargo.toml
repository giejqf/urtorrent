[package]
name = "testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Oracle, tracker and peer orchestration, capture, normalise and diff tooling for urtorrent"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "3", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls-pemfile = "2"
toml = "0.8"
socket2 = "0.6"
# The library under test, driven from a tokio runtime (AGENTS.md 5.6). Only
# `rt`, `macros`, `time` and `sync` are enabled: none of them pull in `mio`,
# and `testkit` is outside the audited library graph anyway.
urtorrent = { path = "../crates/urtorrent", version = "0.2.0" }
# The discriminator checks the library's own request builder against the
# goldens too (a unit-level differential).
tracker = { path = "../crates/tracker", version = "0.2.0" }
# MSE for the tap-peer: interop with the oracle validates it (a symmetric
# mistake cannot complete a handshake with libtorrent), and it lets the tap
# record the oracle's crypto_provide / select and pad lengths.
mse = { path = "../crates/mse", version = "0.2.0" }
profile = { path = "../crates/profile", version = "0.2.0" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }
