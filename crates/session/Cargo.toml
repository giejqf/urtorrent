[package]
name = "session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The urtorrent engine: wires tracker, wire, picker, storage and uring together behind a tokio-native API"

[lints]
workspace = true

[dependencies]
dht = { path = "../dht", version = "0.8.0" }
utp = { path = "../utp", version = "0.8.0" }
bencode = { path = "../bencode", version = "0.8.0" }
metainfo = { path = "../metainfo", version = "0.8.0" }
profile = { path = "../profile", version = "0.8.0" }
wire = { path = "../wire", version = "0.8.0" }
tracker = { path = "../tracker", version = "0.8.0" }
picker = { path = "../picker", version = "0.8.0" }
mse = { path = "../mse", version = "0.8.0" }
# DH exponents for MSE (the getrandom syscall; not on the io_uring data path).
getrandom = "0.3"
uring = { path = "../uring", version = "0.8.0" }
storage = { path = "../storage", version = "0.8.0" }
# Verifying fetched metadata against the info-hash (BEP 9).
sha1.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Public API surface only (AGENTS.md 5.6): runtime-agnostic channels. The
# `rt`/`net`/`fs`/`time`/`io-util` features are banned in the library graph
# and audited by `xtask check`.
tokio = { version = "1", default-features = false, features = ["sync"] }
futures-core = { version = "0.3", default-features = false }
# HTTPS trackers (ADR 0003): rustls through its buffer API over uring sockets,
# default crypto provider, Mozilla roots plus caller-supplied CAs.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
webpki-roots = "1"
rustls-pemfile = "2"

[dev-dependencies]
# Tests drive the API with a minimal thread-parking executor (no tokio runtime
# in the library graph, even as a dev-dependency).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
