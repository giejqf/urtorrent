[package]
name = "urtorrent-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The urtorrent engine: wires tracker, wire, picker, storage and uring together behind a tokio-native API"

[lints]
workspace = true

[dependencies]
dht = { package = "urtorrent-dht", path = "../dht", version = "0.14.1" }
utp = { package = "urtorrent-utp", path = "../utp", version = "0.14.1" }
bencode = { package = "urtorrent-bencode", path = "../bencode", version = "0.14.1" }
metainfo = { package = "urtorrent-metainfo", path = "../metainfo", version = "0.14.1" }
profile = { package = "urtorrent-profile", path = "../profile", version = "0.14.1" }
wire = { package = "urtorrent-wire", path = "../wire", version = "0.14.1" }
tracker = { package = "urtorrent-tracker", path = "../tracker", version = "0.14.1" }
picker = { package = "urtorrent-picker", path = "../picker", version = "0.14.1" }
mse = { package = "urtorrent-mse", path = "../mse", version = "0.14.1" }
# DH exponents for MSE (the getrandom syscall; not on the io_uring data path).
getrandom = "0.3"
uring = { package = "urtorrent-uring", path = "../uring", version = "0.14.1" }
storage = { package = "urtorrent-storage", path = "../storage", version = "0.14.1" }
# Verifying fetched metadata against the info-hash (BEP 9).
sha1.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Public API surface only (AGENTS.md 5.6): runtime-agnostic channels. The
# `rt`/`net`/`fs`/`time`/`io-util` features are banned in the library graph
# and audited by `xtask check`.
tokio = { version = "1", default-features = false, features = ["sync"] }
futures-core = { version = "0.3", default-features = false }
# HTTPS trackers (ADR 0003): rustls through its buffer API over uring sockets,
# default crypto provider, Mozilla roots plus caller-supplied CAs.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
# Tests drive the API with a minimal thread-parking executor (no tokio runtime
# in the library graph, even as a dev-dependency).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
