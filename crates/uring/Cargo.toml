[package]
name = "uring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "io_uring reactor, buffer pools, timers and TCP/UDP/file operations for urtorrent (the only crate with unsafe code)"

# uring is the one crate allowed to contain `unsafe` (AGENTS.md 9), so it does
# NOT inherit the workspace `forbid(unsafe_code)` lint. The other lints are
# mirrored explicitly.
[lints.rust]
missing_docs = "deny"

[lints.clippy]
# `uring` is the low-level systems crate. It parses no untrusted input, so
# `expect`/`panic` on internal invariants (a stalled ring, a completed root
# future, a slab type mismatch) are allowed here; they are never on a path
# reachable from network or disk input (AGENTS.md 9). Sloppy `unwrap`s are
# still denied.
unwrap_used = "deny"

[dependencies]
io-uring = "0.7"
libc.workspace = true
tracing.workspace = true
thiserror.workspace = true

[[bin]]
name = "uring-probe"
path = "src/bin/uring-probe.rs"

[[bin]]
name = "syscall-probe"
path = "src/bin/syscall-probe.rs"
