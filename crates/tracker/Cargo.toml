[package]
name = "urtorrent-tracker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Sans-IO HTTP/UDP tracker announce and scrape builders, parsers and tier/backoff state machine for urtorrent"

[lints]
workspace = true

[dependencies]
bencode = { package = "urtorrent-bencode", path = "../bencode", version = "0.14.2" }
metainfo = { package = "urtorrent-metainfo", path = "../metainfo", version = "0.14.2" }
profile = { package = "urtorrent-profile", path = "../profile", version = "0.14.2" }
# Pure-Rust inflate for gzip-compressed tracker responses (we advertise
# `Accept-Encoding: gzip` because the oracle does).
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
